name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  release:
    # Package + publish on a v* tag, or on a manual run (Actions -> Run workflow).
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Resolve vsix name from package.json version
        id: ver
        run: echo "vsix=workspace-theme-$(node -p "require('./package.json').version").vsix" >> "$GITHUB_OUTPUT"
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies -o "${{ steps.ver.outputs.vsix }}"
      - name: Publish to Open VSX
        run: npx --yes ovsx publish "${{ steps.ver.outputs.vsix }}" -p "${{ secrets.OVSX_PAT }}"
      - name: Create GitHub Release with the VSIX (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.ver.outputs.vsix }}" \
            --title "${{ github.ref_name }}" \
            --notes "Install from Open VSX (Extensions panel), or grab the .vsix below:
          \`\`\`
          code --install-extension ${{ steps.ver.outputs.vsix }}
          # or, for code-server:
          code-server --install-extension ${{ steps.ver.outputs.vsix }}
          \`\`\`"
