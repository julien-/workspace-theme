name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  release:
    # Build the .vsix and attach it to a GitHub Release when a v* tag is pushed.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies -o workspace-theme-${{ github.ref_name }}.vsix
      - name: Create GitHub Release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" workspace-theme-*.vsix \
            --title "${{ github.ref_name }}" \
            --notes "Download the .vsix below and install it:
          \`\`\`
          code --install-extension workspace-theme-${{ github.ref_name }}.vsix
          # or, for code-server:
          code-server --install-extension workspace-theme-${{ github.ref_name }}.vsix
          \`\`\`"
